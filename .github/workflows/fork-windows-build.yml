name: Fork Windows build

on:
  push:
    tags:
      - 'xournal-studio-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag, e.g. xournal-studio-v1.3.8. Leave empty to build artifacts only.'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  windows:
    uses: ./.github/workflows/make-installer-windows.yml
    with:
      runner: windows-latest
      displayed_name: Xournal Studio
      msystem: UCRT64
      msys_package_env: ucrt-x86_64
      publish_portable_version: true
      artifact_version_suffix: -fork
      fork_installer: true
      installer_prefix: xournal-studio

  release:
    name: Publish Xournal Studio release
    if: ${{ github.event_name == 'push' || inputs.release_tag != '' }}
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v6
        with:
          name: Windows package X64 ucrt-x86_64
          path: release-assets
      - name: Download portable version artifact
        uses: actions/download-artifact@v6
        with:
          name: Windows package X64 ucrt-x86_64 (portable version)
          path: portable
      - name: Zip portable version
        run: |
          cd portable
          for dir in */; do
            name="${dir%/}"
            zip -qr "../release-assets/${name/xournalpp-/xournal-studio-}.zip" "$name"
          done
          ls -l ../release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Xournal Studio ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip
