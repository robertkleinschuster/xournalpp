# Template for running Windows release jobs

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      displayed_name:
        type: string
        required: true
      msystem:
        type: string
        required: true
      msys_package_env:
        type: string
        required: true
      publish_portable_version:
        type: boolean
        required: false
        default: false
      head_sha:          # SHA of the commit to build. Defaults to the head of the triggering event (cf github doc.)
        type: string
        default: ''
      build_type:
        type: string
        default: 'RelWithDebInfo'
      extra_cmake_flags:
        type: string
        default: ''
      artifact_version_suffix:  # Additional version string appended to 1.2.3+dev (for instance) in artifacts names
        type: string
        default: ''
      fork_installer:
        type: boolean
        default: false
      installer_prefix:
        type: string
        default: xournalpp
    outputs:
      link:
        description: URL of the produced installer
        value: ${{ jobs.release-windows.outputs.link }}
      link_portable:
        description: URL of the portable version (if produced)
        value: ${{ jobs.release-windows.outputs.link_portable }}

jobs:
  release-windows:
    name: Create installer for ${{ inputs.displayed_name }}
    runs-on: ${{ inputs.runner }}
    outputs:
      link: ${{ steps.publish.outputs.artifact-url }}
      link_portable: ${{ steps.publish-portable.outputs.artifact-url }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
      - name: 'Install dependencies'
        uses: ./.github/actions/install_deps_windows
        with:
          msystem: ${{ inputs.msystem }}
          msys_package_env: ${{ inputs.msys_package_env }}
      - name: 'Build Xournal++'
        uses: ./.github/actions/build
        with:
          build_type: ${{ inputs.build_type }}
          extra_cmake_flags: ${{ inputs.extra_cmake_flags }}
          shell: msys2 {0}
      - name: 'Create installer'
        id: create-installer
        working-directory: ${{github.workspace}}/build
        shell: msys2 {0}
        run: |
          if [ "${{ inputs.fork_installer }}" = "true" ]; then
            XOURNALPP_FORK_BUILD=1 bash -lc "../windows-setup/package.sh"
          else
            bash -lc "../windows-setup/package.sh"
          fi

          export VERSION=$(cat VERSION | sed '1q;d')
          export ARCH=$(cat VERSION | sed '4q;d')
          export FULL_VERSION_STRING="$VERSION${{ inputs.artifact_version_suffix }}"
          export INSTALLER_FILENAME="${{ inputs.installer_prefix }}-$FULL_VERSION_STRING-windows-setup-$ARCH.exe"

          if [ "${{ inputs.fork_installer }}" = "true" ]; then
            mv xournal-studio-setup.exe "$INSTALLER_FILENAME"
          else
            mv xournalpp-setup.exe "$INSTALLER_FILENAME"
          fi
          echo "artifact=$INSTALLER_FILENAME" >> $GITHUB_OUTPUT

          if [ ${{ inputs.publish_portable_version }} ]; then
            mkdir portable_content/
            mv dist "portable_content/xournalpp-$FULL_VERSION_STRING-windows-portable-$ARCH"
          fi
      - name: 'Smoke test the package without MSYS2'
        if: ${{ inputs.fork_installer }}
        working-directory: ${{github.workspace}}/build
        shell: pwsh
        run: |
          # Run the packaged program with only Windows on PATH, like on a machine without MSYS2:
          # a DLL or data file missing from the package makes it fail here instead of on the user's machine.
          $exe = Get-ChildItem -Recurse -Filter xournalpp.exe -Path dist, portable_content -ErrorAction SilentlyContinue |
              Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $exe) { throw 'Packaged xournalpp.exe not found' }
          $scratch = Join-Path $env:RUNNER_TEMP 'smoke'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:MSYSTEM -ErrorAction SilentlyContinue
          $env:XDG_CONFIG_HOME = "$scratch\config"; $env:XDG_DATA_HOME = "$scratch\data"; $env:XDG_CACHE_HOME = "$scratch\cache"
          $log = "$scratch\stderr.txt"
          $p = Start-Process -FilePath $exe.FullName -PassThru -Wait -NoNewWindow -RedirectStandardError $log `
              -ArgumentList "--create-pdf=`"$scratch\out.pdf`"", "`"${{github.workspace}}\test\files\benchmark\typed-text.xopp`""
          Get-Content $log
          if ($p.ExitCode -ne 0) { throw "Export failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$scratch\out.pdf")) { throw 'No PDF was written' }
          if (Select-String -Path $log -Pattern 'Fontconfig error|Gtk-WARNING|Could not load|cannot open shared' -Quiet) {
              throw 'The packaged program reported missing files'
          }
      - name: 'Publish package'
        id: publish
        uses: actions/upload-artifact@v6
        with:
          name: "Windows package ${{ runner.arch }} ${{ inputs.msys_package_env }}"
          path: "${{github.workspace}}/build/${{ steps.create-installer.outputs.artifact }}"
          compression-level: 0
          if-no-files-found: error
      - name: 'Publish portable version'
        id: publish-portable
        if: ${{ inputs.publish_portable_version }}
        uses: actions/upload-artifact@v6
        with:
          name: "Windows package ${{ runner.arch }} ${{ inputs.msys_package_env }} (portable version)"
          path: "${{github.workspace}}/build/portable_content"
          if-no-files-found: error
